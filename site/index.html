<body class="landing">

    <!-- Hero (Figma layout node 1599:5807). Phone centre; two 125×167 category
         cards (Electrical, Landscaping) at the frame edges, dimmed to 20%. The
         stage isn't clipped, so on web they show fully (not cut off); on a phone
         they slip behind the screen edges. Only the phone photo rotates. -->
    <section class="stage" aria-hidden="true">
      <div class="peek peek-left">
        <img alt="" src="media/slides/slide-02-electrical.jpg?v=2">
      </div>
      <div class="peek peek-right">
        <img alt="" src="media/slides/slide-17-moto.jpg?v=2">
      </div>

      <div class="phone">
        <!-- Two layers only: the carousel script sets their src and cross-slides
             them (incoming from the left, outgoing to the right). The job list —
             photo, category label, and the search text typed below — lives in the
             script. -->
        <div class="phone-slides">
          <img class="phone-slide is-front" src="media/slides/slide-01-plumbing.jpg?v=2" alt="">
          <img class="phone-slide" alt="">
        </div>

        <div class="phone-status">
          <span class="phone-time">9:41</span>
          <svg class="phone-signals" viewBox="0 0 44 12" fill="#fff" aria-hidden="true">
            <rect x="0"   y="7"   width="2.6" height="5"  rx="0.7"/>
            <rect x="3.9" y="5"   width="2.6" height="7"  rx="0.7"/>
            <rect x="7.8" y="3"   width="2.6" height="9"  rx="0.7"/>
            <rect x="11.7" y="1"  width="2.6" height="11" rx="0.7"/>
            <path fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round"
                  d="M18.4 4.2c2.4-2.1 6-2.1 8.4 0M20.2 6.4c1.3-1.1 3.6-1.1 4.9 0"/>
            <circle cx="22.65" cy="9.1" r="1.15"/>
            <rect x="31" y="1.6" width="10.5" height="8.8" rx="2.4" fill="none" stroke="#fff" stroke-width="1" opacity="0.5"/>
            <rect x="32.2" y="2.8" width="8.1" height="6.4" rx="1.4"/>
            <rect x="42.3" y="4.2" width="1.4" height="3.6" rx="0.7" opacity="0.5"/>
          </svg>
        </div>

        <div class="phone-input">
          <span class="phone-input-text">fix a faucet leak</span>
          <span class="phone-input-send" aria-hidden="true">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
              <path d="M3 8h9M8.5 3.8 12.7 8l-4.2 4.2" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

  <footer class="landing-footer">
    <a class="footer-terms" href="terms.html">Terms of Service</a>

  </footer>

  <script>
    // Photo carousel: each tick the LEFT card's job slides into the phone from the
    // left, the phone's current job slides out to the right (onto the right card),
    // and a new job appears on the left — left → centre → right. The search field
    // retypes to a deliberate, human-sounding request for the centred job. Honors
    // reduced-motion (holds on the first job, no rotation).
    (function () {
      var stage = document.querySelector(".stage");
      if (!stage) return;
      var phone = stage.querySelector(".phone");
      var layers = [].slice.call(phone.querySelectorAll(".phone-slide"));
      var caption = phone.querySelector(".phone-input-text");
      var leftPeek = stage.querySelector(".peek-left");
      var rightPeek = stage.querySelector(".peek-right");
      if (layers.length < 2 || !caption || !leftPeek || !rightPeek) return;

      var BASE = "media/slides/", V = "?v=2";
      // photo · short category (the side-card label) · the search text typed below.
      // Only the crisp, card-backed photos are listed here; the four older upscaled
      // slides (tires, appliances, body, auto glass) were dropped from the cycle.
      var JOBS = [
        { img: "slide-01-plumbing.jpg",    cat: "Plumbing",        q: "fix a faucet leak" },
        { img: "slide-02-electrical.jpg",  cat: "Electrical",      q: "install a ceiling light" },
        { img: "slide-03-repair.jpg",      cat: "Auto repair",     q: "car service: how to replace oil" },
        { img: "slide-04-hvac.jpg",        cat: "HVAC",            q: "AC not blowing cold air" },
        { img: "slide-05-landscaping.jpg", cat: "Landscaping",     q: "redo my front yard" },
        { img: "slide-07-pest.jpg",        cat: "Pest control",    q: "get rid of ants in the kitchen" },
        { img: "slide-10-carpentry.jpg",   cat: "Carpentry",       q: "build custom shelves" },
        { img: "slide-11-painting.jpg",    cat: "Painting",        q: "repaint the bedroom" },
        { img: "slide-12-detailing.jpg",   cat: "Auto detailing",  q: "detail my car inside and out" },
        { img: "slide-13-roofing.jpg",     cat: "Roofing",         q: "fix a leaking roof" },
        { img: "slide-14-flooring.jpg",    cat: "Flooring",        q: "install hardwood floors" },
        { img: "slide-16-windows.jpg",     cat: "Windows & doors", q: "install sliding doors" },
        { img: "slide-17-moto.jpg",        cat: "Motorcycle",      q: "motorcycle won't start" }
      ];
      var n = JOBS.length;
      var mod = function (k) { return ((k % n) + n) % n; };
      var url = function (k) { return BASE + JOBS[mod(k)].img + V; };

      // Preload every photo so a rotation never flashes an unloaded frame.
      JOBS.forEach(function (j) { var im = new Image(); im.src = BASE + j.img + V; });

      var leftImg = leftPeek.querySelector("img");
      var rightImg = rightPeek.querySelector("img");

      var i = 0;      // centred job
      var front = 0;  // which phone layer currently shows the centred job

      function paintPeeks() {
        // left = the job about to enter the phone; right = the one just left it.
        leftImg.src = url(i + 1);
        rightImg.src = url(i - 1);
      }

      layers[front].src = url(i);
      caption.textContent = JOBS[i].q;
      paintPeeks();

      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var HOLD = 3600; // ms each job stays centred
      function advance() {
        var prev = front, next = 1 - front;
        i = mod(i + 1);

        layers[next].src = url(i);
        layers[next].classList.remove("is-front", "outgoing");
        layers[next].classList.add("incoming");   // new centre slides in from the left
        layers[prev].classList.remove("is-front", "incoming");
        layers[prev].classList.add("outgoing");    // old centre slides out to the right
        setTimeout(function () {
          layers[next].classList.remove("incoming");
          layers[next].classList.add("is-front");
          layers[prev].classList.remove("outgoing");
        }, 620);
        front = next;

        // retype the request under cover of the motion
        caption.style.opacity = "0";
        setTimeout(function () { caption.textContent = JOBS[i].q; caption.style.opacity = "1"; }, 240);

        // side cards take their new neighbours, with the swap animation restarted
        leftPeek.classList.remove("swap"); rightPeek.classList.remove("swap");
        void leftPeek.offsetWidth;         // reflow so the animation replays
        paintPeeks();
        leftPeek.classList.add("swap"); rightPeek.classList.add("swap");
      }
      setInterval(advance, HOLD);
    })();
  </script>
</body>
</html>
