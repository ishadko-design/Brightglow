  <script>
    // Phone photo slideshow (the side cards are static, per Figma): each tick the
    // previous photo cross-dissolves to the next, and the input caption re-types
    // to the matching service. Honors reduced-motion.
    (function () {
      var stage = document.querySelector(".stage");
      if (!stage) return;
      var phone = stage.querySelector(".phone");
      var slides = [].slice.call(phone.querySelectorAll(".phone-slide"));
      var caption = phone.querySelector(".phone-input-text");
      var n = slides.length;
      if (n < 2 || !caption) return;

      function catOf(k) { return slides[((k % n) + n) % n].getAttribute("data-cat"); }

      if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;

      var i = 0;
      var HOLD = 3600; // ms each job stays centred
      function advance() {
        var prev = i;
        i = (i + 1) % n;
        slides[prev].classList.remove("is-active", "init");
        slides[prev].classList.add("under");      // hold full behind the incoming
        slides[i].classList.remove("under");
        slides[i].classList.add("is-active");     // fade up on top
        setTimeout(function () { slides[prev].classList.remove("under"); }, 620);
        // caption re-types under cover of the dissolve
        caption.style.opacity = "0";
        setTimeout(function () {
          caption.textContent = catOf(i);
          caption.style.opacity = "1";
        }, 260);
      }
      setInterval(advance, HOLD);
    })();
  </script>
