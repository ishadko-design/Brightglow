<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Brightglow — modern preview</title>
<link rel="stylesheet" href="styles.css?v=4">
<style>
  /* ---- preview-only overrides: a fixed, comfortable scale so the whole hero
         + showcase reads in one view while you judge the motion ---- */
  body.landing.preview {
    --s: 0.72px;
    height: auto;
    min-height: 100svh;
    overflow: hidden;
    display: block;
  }
  @media (min-width: 700px) { body.landing.preview { --s: 0.86px; } }

  /* 1 — WebGL flowing gradient backdrop (hand-written shader, no library) */
  #gl {
    position: fixed; inset: 0; width: 100%; height: 100%;
    z-index: -2; display: block;
  }
  /* CSS fallback if WebGL/reduced-motion is unavailable — the current site's
     amber glow, so it never looks broken. */
  body.landing.preview::before {
    background:
      linear-gradient(212deg, rgba(255,172,54,0.35) 0%, rgba(10,10,11,0) 45%);
    z-index: -1;
  }
  html.has-gl body.landing.preview::before { opacity: 0; }

  /* 2 — fine film grain over everything */
  .grain {
    position: fixed; inset: -50%; z-index: -1; pointer-events: none;
    opacity: 0.05; mix-blend-mode: overlay;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    animation: grain 1.2s steps(3) infinite;
  }
  @keyframes grain {
    0%{transform:translate(0,0)} 33%{transform:translate(-4%,3%)} 66%{transform:translate(3%,-2%)}
  }

  /* 4 — entrance choreography */
  @keyframes rise { to { opacity: 1; transform: none; } }
  .reveal { opacity: 0; transform: translateY(18px);
            animation: rise .9s cubic-bezier(.2,.75,.2,1) forwards; }
  .r1{animation-delay:.05s}.r2{animation-delay:.16s}.r3{animation-delay:.28s}
  .r4{animation-delay:.4s}.r5{animation-delay:.52s}
  .stage.reveal { transform: translateY(28px) scale(.985); }

  /* 5 — interaction polish: CTA glow + press, card lift on hover */
  .appstore-btn { position: relative; transition: transform .18s ease, box-shadow .3s ease; box-shadow: 0 8px 30px rgba(0,57,245,.35); }
  .appstore-btn:hover { transform: translateY(-2px); box-shadow: 0 14px 44px rgba(0,57,245,.55); }
  .appstore-btn:active { transform: translateY(0); }
  .biz-link { transition: background .2s ease, transform .2s ease; }
  .biz-link:hover { transform: translateY(-1px); }
  .stage .float { transition: filter .3s ease; }

  /* the parallax layer wraps the stage so entrance (on .stage) and pointer
     parallax (on .parallax via a CSS var) never fight over transform */
  .stage .float { will-change: transform; }

  @media (prefers-reduced-motion: reduce) {
    .grain, .reveal, .stage.reveal { animation: none; }
    .reveal { opacity: 1; transform: none; }
  }
</style>
</head>
<body class="landing preview">
  <canvas id="gl" aria-hidden="true"></canvas>
  <div class="grain" aria-hidden="true"></div>

  <header class="topbar">
    <a class="logo reveal r1" href="#">
      <img class="appicon" src="media/appicon.png" alt="">
      <span class="wordmark">Brightglow</span>
    </a>
    <a class="biz-link reveal r1" href="#">For businesses</a>
  </header>

  <main class="column">
    <section class="hero-copy">
      <h1 class="reveal r2">Get your <span class="emoji">🏡 🚗</span> job done right</h1>
      <p class="sub reveal r3">
        See real photos of local pros' actual work before you hire. Get a
        price range, then start a spam-free chat with the ones that fit.
      </p>
      <a class="appstore-btn reveal r4" href="#">
        <svg width="20" height="24" viewBox="0 0 20 24" fill="currentColor" aria-hidden="true">
          <path d="M16.36 12.77c-.03-2.9 2.37-4.29 2.48-4.36-1.35-1.97-3.45-2.24-4.2-2.27-1.79-.18-3.49 1.05-4.4 1.05-.9 0-2.3-1.02-3.79-1-1.95.03-3.74 1.13-4.74 2.87-2.02 3.5-.52 8.69 1.45 11.53.96 1.39 2.11 2.95 3.62 2.9 1.45-.06 2-.94 3.76-.94 1.75 0 2.25.94 3.79.91 1.57-.03 2.56-1.42 3.52-2.82 1.11-1.61 1.56-3.17 1.59-3.25-.04-.02-3.05-1.17-3.08-4.62zM13.46 4.25c.8-.97 1.34-2.32 1.19-3.66-1.15.05-2.55.77-3.38 1.74-.74.85-1.39 2.22-1.22 3.53 1.29.1 2.6-.65 3.41-1.61z"/>
        </svg>
        Download from App Store
      </a>
    </section>
  </main>

  <section class="stage reveal r5">
    <img class="float card-flooring" data-depth="0.5" src="media/card-flooring.png" alt="">
    <img class="float card-dent" data-depth="0.9" src="media/card-dent.png" alt="">
    <img class="phone" data-depth="0.15" src="media/phone-sink.png" alt="">
    <img class="float card-bulb" data-depth="0.3" src="media/card-bulb.png" alt="">
    <img class="float card-flat-tire" data-depth="0.7" src="media/card-flat-tire.png" alt="">
    <img class="float card-roof-leak" data-depth="1.1" src="media/card-roof-leak.png" alt="">
    <span class="float chip chip-dent" data-depth="0.9">Dent</span>
    <span class="float chip chip-flooring" data-depth="0.5">Flooring</span>
    <span class="float chip chip-bulb" data-depth="0.3">Flickering lights</span>
    <span class="float chip chip-roof-leak" data-depth="1.1">Roof leak</span>
    <span class="float chip chip-flat-tire" data-depth="0.7">Flat tire</span>
  </section>

<script type="x-shader/x-fragment" id="frag">
precision highp float;
uniform vec2 u_res;
uniform float u_time;

float hash(vec2 p){ p = fract(p*vec2(123.34,456.21)); p += dot(p, p+45.32); return fract(p.x*p.y); }
float noise(vec2 p){
  vec2 i=floor(p), f=fract(p);
  float a=hash(i), b=hash(i+vec2(1.,0.)), c=hash(i+vec2(0.,1.)), d=hash(i+vec2(1.,1.));
  vec2 u=f*f*(3.-2.*f);
  return mix(mix(a,b,u.x), mix(c,d,u.x), u.y);
}
float fbm(vec2 p){ float v=0., a=.5; for(int i=0;i<5;i++){ v+=a*noise(p); p=p*2.02; a*=.5; } return v; }

void main(){
  vec2 uv = gl_FragCoord.xy / u_res.xy;
  vec2 p = uv * vec2(u_res.x/u_res.y, 1.0) * 2.2;
  float t = u_time * 0.045;

  // domain-warped flow
  vec2 q = vec2(fbm(p + vec2(0., t)), fbm(p + vec2(5.2, -t)));
  vec2 r = vec2(fbm(p + 2.0*q + vec2(1.7,9.2) + 0.15*t),
                fbm(p + 2.0*q + vec2(8.3,2.8) - 0.13*t));
  float f = fbm(p + 2.0*r);

  vec3 base  = vec3(0.009, 0.009, 0.015);
  vec3 amber = vec3(1.0, 0.58, 0.14);
  vec3 blue  = vec3(0.03, 0.09, 0.40);

  vec3 col = base;
  // deep brand blue seeping in from the lower-left shadows
  col = mix(col, blue, smoothstep(0.4, 1.0, f) * 0.32 * (1.0 - uv.x*0.55) * (1.0 - uv.y*0.4));
  // amber, concentrated toward the top-right and driven by the flow
  float amt = smoothstep(0.5, 1.12, r.x) * (0.28 + 0.72*uv.x) * (0.30 + 0.70*uv.y);
  col = mix(col, amber, amt * 0.6);

  // brand glow anchored top-right, gently pulsing with the flow
  float glow = smoothstep(1.1, 0.04, distance(uv, vec2(0.95, 0.99)));
  col += amber * glow * (0.20 + 0.16*f);

  // keep the centre dark so the hero text stays crisp
  col *= 1.0 - 0.34 * smoothstep(0.1, 0.85, distance(uv, vec2(0.42, 0.44)));
  // vignette
  col *= 1.0 - 0.42 * length(uv - 0.5);
  // film grain
  col += (hash(gl_FragCoord.xy + fract(u_time)) - 0.5) * 0.035;

  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>
<script>
(function(){
  var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  var canvas = document.getElementById('gl');
  var gl = !reduce && (canvas.getContext('webgl') || canvas.getContext('experimental-webgl'));
  if (!gl) { return; }                    // CSS fallback stays visible
  document.documentElement.classList.add('has-gl');

  function sh(type, src){ var s=gl.createShader(type); gl.shaderSource(s,src); gl.compileShader(s); return s; }
  var vs = sh(gl.VERTEX_SHADER, 'attribute vec2 a; void main(){ gl_Position=vec4(a,0.,1.); }');
  var fs = sh(gl.FRAGMENT_SHADER, document.getElementById('frag').textContent);
  var prog = gl.createProgram(); gl.attachShader(prog,vs); gl.attachShader(prog,fs); gl.linkProgram(prog); gl.useProgram(prog);
  var buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  var loc = gl.getAttribLocation(prog,'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  var uRes = gl.getUniformLocation(prog,'u_res'), uTime = gl.getUniformLocation(prog,'u_time');

  function resize(){
    var dpr = Math.min(devicePixelRatio||1, 1.5);        // cap DPR for battery
    var w = innerWidth*dpr, h = innerHeight*dpr;
    canvas.width=w; canvas.height=h; gl.viewport(0,0,w,h); gl.uniform2f(uRes,w,h);
  }
  addEventListener('resize', resize); resize();

  var start = performance.now(), raf, running = true;
  function frame(now){ gl.uniform1f(uTime,(now-start)/1000); gl.drawArrays(gl.TRIANGLES,0,3); raf=requestAnimationFrame(frame); }
  raf = requestAnimationFrame(frame);
  // pause when tab is hidden — no wasted battery
  document.addEventListener('visibilitychange', function(){
    if (document.hidden && running){ cancelAnimationFrame(raf); running=false; }
    else if (!document.hidden && !running){ start=performance.now()-(start?0:0); running=true; raf=requestAnimationFrame(frame); }
  });

  // 3 — cursor parallax (desktop) + device-tilt (mobile) on the floating cards
  if (!reduce){
    var floats = [].slice.call(document.querySelectorAll('.stage .float, .stage .phone'));
    var tx=0, ty=0, cx=0, cy=0;
    function apply(){
      cx += (tx-cx)*0.08; cy += (ty-cy)*0.08;
      floats.forEach(function(el){
        var d = parseFloat(el.dataset.depth)||0;
        var base = el.classList.contains('phone') ? 'translateX(-50%)' : '';
        el.style.transform = base + ' translate3d(' + (cx*d*26).toFixed(1) + 'px,' + (cy*d*26).toFixed(1) + 'px,0)';
      });
      requestAnimationFrame(apply);
    }
    addEventListener('mousemove', function(e){ tx = (e.clientX/innerWidth-0.5)*2; ty = (e.clientY/innerHeight-0.5)*2; });
    addEventListener('deviceorientation', function(e){ if(e.gamma!=null){ tx = Math.max(-1,Math.min(1,e.gamma/25)); ty = Math.max(-1,Math.min(1,(e.beta-45)/25)); } });
    requestAnimationFrame(apply);
  }
})();
</script>
</body>
</html>
