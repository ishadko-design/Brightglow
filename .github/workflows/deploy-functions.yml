name: Deploy Supabase functions

# Push to brightglow-ios (the branch the app ships from) → every Edge Function
# is deployed to production, then a live check prices the jobs users reported
# and fails the run if any answer comes from the formula or is out of band.
# Also runnable by hand from the Actions tab (Run workflow → brightglow-ios).
on:
  push:
    branches: [brightglow-ios]
    paths:
      - supabase/functions/**
      - supabase/config.toml
      - scripts/smoke-pricing.sh
      - .github/workflows/deploy-functions.yml
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: qxoseyrlbvblpwqzwvvk
  SUPABASE_URL: https://qxoseyrlbvblpwqzwvvk.supabase.co

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        # No function name = every function under supabase/functions, with the
        # per-function settings (verify_jwt, …) from supabase/config.toml.
        run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Price the reported jobs against production
        run: scripts/smoke-pricing.sh
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
