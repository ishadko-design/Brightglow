name: Deploy Supabase functions

# Push to brightglow-ios (the branch the app ships from) → every Edge Function
# is deployed to production, then a live check prices the jobs users reported
# and fails the run if any answer comes from the formula or is out of band.
# Also runnable by hand from the Actions tab (Run workflow → brightglow-ios).
on:
  push:
    branches: [brightglow-ios]
    paths:
      - supabase/functions/**
      - supabase/config.toml
      - scripts/smoke-pricing.sh
      - .github/workflows/deploy-functions.yml
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: qxoseyrlbvblpwqzwvvk
  SUPABASE_URL: https://qxoseyrlbvblpwqzwvvk.supabase.co

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy all functions
        # No function name = every function under supabase/functions, with the
        # per-function settings (verify_jwt, …) from supabase/config.toml.
        # Without the token this is skipped with a warning, so the workflow can
        # live on the branch before the one-time setup is done.
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN secret not set — nothing deployed. Add it under Settings → Secrets and variables → Actions."
            exit 0
          fi
          supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF" --use-api
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}

  live-check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Price the reported jobs against production
        # The anon key is the public publishable key the site already ships
        # (site/biz/portal.js), so it is read from there, not stored as a
        # secret. APP_TOKEN gates the function: without it every request is
        # a 401, so the check is skipped with a warning rather than failing.
        run: |
          if [ -z "$APP_TOKEN" ]; then
            echo "::warning::APP_TOKEN secret not set — live price check skipped. Add it to verify every deploy."
            exit 0
          fi
          export SUPABASE_ANON_KEY="${SUPABASE_ANON_KEY:-$(grep -oE 'sb_publishable_[A-Za-z0-9_-]+' site/biz/portal.js | head -1)}"
          scripts/smoke-pricing.sh
        env:
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
