name: Pricing cache keys (read-only)

# Lists the most recent AI price cache entries: key (taxonomy job + bucketed
# facts + metro code), the band, whether it was web-searched, and when it was
# written. Read-only (a SELECT through the Management API). This repo is
# PUBLIC, so it prints only cache keys and numbers — never request text or
# ZIPs (the cache holds neither).
# Run it from the Actions tab (Run workflow → brightglow-ios) or via the API.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: How many recent entries to list
        default: "40"
  push:
    branches: [brightglow-ios]
    paths:
      - .github/workflows/pricing-keys.yml
      - scripts/audit-price-cache.sh
  # After every function deploy, and daily: a failed run emails the owner.
  workflow_run:
    workflows: ["Deploy Supabase functions"]
    types: [completed]
  schedule:
    - cron: "17 14 * * *"

jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: List recent AI price cache entries
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: qxoseyrlbvblpwqzwvvk
          LIMIT: ${{ inputs.limit || '40' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN not set"; exit 0
          fi
          n=$(( ${LIMIT//[^0-9]/} + 0 )); [ "$n" -gt 0 ] && [ "$n" -le 200 ] || n=40
          q="select cache_key, low, typical, high, (basis::jsonb ->> 'searched') as searched, created_at
             from grounded_estimate_cache where cache_key like 'it2:%'
             order by created_at desc limit $n"
          resp=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$q" '{query: $q}')")
          if ! jq -e 'type == "array"' >/dev/null 2>&1 <<<"$resp"; then
            echo "::error::query API: $(jq -r '(.message // .error // .) | tostring' <<<"$resp" 2>/dev/null | head -c 300)"; exit 1
          fi
          echo "Most recent $n AI price cache entries (key | low–high, typical | searched | written):"
          jq -r '.[] | "\(.cache_key)\t$\(.low|tonumber|floor)–$\(.high|tonumber|floor), typ $\(.typical|tonumber|floor)\tsearched=\(.searched)\t\(.created_at)"' <<<"$resp"

      - name: Audit the cache (kind/job mismatch, same job split, odd bands)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          REF: qxoseyrlbvblpwqzwvvk
        run: |
          [ -n "$SUPABASE_ACCESS_TOKEN" ] || exit 0
          q="select cache_key, low, typical, high, created_at from grounded_estimate_cache
             where cache_key like 'it2:%' and created_at > now() - interval '14 days'
             order by created_at desc limit 500"
          resp=$(curl -sS -X POST "https://api.supabase.com/v1/projects/$REF/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$q" '{query: $q}')")
          jq -e 'type == "array"' >/dev/null 2>&1 <<<"$resp" || { echo "::error::query API failed"; exit 1; }
          bash scripts/audit-price-cache.sh <<<"$resp"
