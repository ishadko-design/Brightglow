project_id = "brightglow"

# The search proxy is public for now (Phase 1) — protected by the Google per-day
# quota cap. Real auth is a Phase 4 hardening step (see docs/cheap-api-plan.md).
[functions.search]
verify_jwt = false

[functions.verdicts]
verify_jwt = false

# Vision photo-tagging: public like the rest of the photo pipeline (search /
# verdicts), gated in-code by APP_TOKEN.
[functions.phototags]
verify_jwt = false

[functions.pricing]
verify_jwt = false

# Free website-photo enrichment: reads a business's own site for work photos,
# public like the rest of the pipeline, gated in-code by APP_TOKEN. Caches per
# place_id so the external fetch runs once per business, not per gallery-open.
[functions.business-photos]
verify_jwt = false

# Contractor logo resolver: public like the rest of the enrichment pipeline,
# gated in-code by APP_TOKEN. Resolves once per business, hosts in the public
# `business-logos` bucket.
[functions.logos]
verify_jwt = false

# Account deletion must be authenticated: verify_jwt rejects unauthenticated
# calls, and the function additionally requires a real user (not the anon key).
[functions.delete-account]
verify_jwt = false
