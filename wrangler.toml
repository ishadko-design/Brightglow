# Cloudflare Worker that serves brightglow.co.
#
# The site is static (site/), but it can't be a pure assets-only Worker: the
# business portal needs /api/* and /chat to come from OUR origin rather than
# LeadBridge's Railway URL. LeadBridge sends no CORS headers, so a cross-origin
# POST from the portal is blocked by the browser; proxying through this Worker
# makes those calls same-origin. See worker.js.
#
# Deploy:  npx wrangler deploy   (this is the Deploy command Cloudflare runs
#                                 when the repo is connected)

name = "brightglow"
main = "worker.js"
compatibility_date = "2026-07-16"

# Static site. Directory index.html (so /biz/ works) is handled by the
# default html_handling — no config needed.
#
# not_found_handling MUST stay "none": anything else makes the asset router
# answer unmatched paths itself and short-circuit worker.js, which would kill
# the /api/* and /chat proxy the portal depends on. "none" lets a non-asset
# request fall through to the Worker.
[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "none"
