# Cloudflare Worker that serves brightglow.co.
#
# The site is static (site/), but it can't be a pure assets-only Worker: the
# business portal needs /api/* and /chat to come from OUR origin rather than
# LeadBridge's Railway URL. LeadBridge sends no CORS headers, so a cross-origin
# POST from the portal is blocked by the browser; proxying through this Worker
# makes those calls same-origin. See worker.js.
#
# Deploy:  npx wrangler deploy   (this is the Deploy command Cloudflare runs
#                                 when the repo is connected)

name = "brightglow"
main = "worker.js"
compatibility_date = "2026-07-16"

# Static site. Directory index.html (so /biz/ works) is handled by the
# default html_handling — no config needed.
#
# not_found_handling MUST stay "none": anything else makes the asset router
# answer unmatched paths itself and short-circuit worker.js, which would kill
# the /api/* and /chat proxy the portal depends on. "none" lets a non-asset
# request fall through to the Worker.
#
# run_worker_first: the private analytics page IS a real asset (analytics.html),
# so by default the asset router would serve it directly and skip the Worker —
# leaving the Basic-Auth gate in worker.js unreachable for the page itself. List
# its paths here so the Worker runs FIRST and can enforce the login before the
# HTML is served.
#
# "/*" is here for the same reason at site scale: without it, assets-first
# routing skips worker.js for every static page, so the www.brightglow.co →
# brightglow.co 301 at the top of worker.js never fires (verified Oct 7 and
# Nov 10: www served 200 duplicates). With "/*" every request runs the Worker
# first; worker.js falls through to env.ASSETS.fetch for normal paths, so
# static serving is unchanged apart from the host check. Do NOT remove "/*"
# without a dashboard Redirect Rule in place — www duplicates come back.
[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "none"
run_worker_first = ["/analytics", "/analytics.html", "/analytics/data", "/*"]
